name: site-audit
on:
  push:
    branches: [claude/project-thread-1dztv7]
    paths: ['tools/site-audit/**', '.github/workflows/site-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: site-audit
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cd tools/site-audit
          npm init -y >/dev/null
          npm i playwright@1.56.1 sharp@0.33.5 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk >/dev/null 2>&1 || true
      - run: node tools/site-audit/shoot.mjs ${{ matrix.shard }} 8
      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.shard }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore
  collect:
    needs: shoot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: shots-*
          merge-multiple: true
      - run: |
          mkdir -p audit-shots
          cp -r dl/* audit-shots/ 2>/dev/null || true
          git config user.name "site-audit bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit-shots
          git commit -qm "Снимки сайтов для аудита (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break; sleep 5; done
