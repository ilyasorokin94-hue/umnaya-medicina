name: site-audit
on:
  push:
    branches: [claude/project-thread-1dztv7]
    paths: ['tools/site-audit/**', '.github/workflows/site-audit.yml']
  workflow_dispatch:
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cd tools/site-audit
          npm init -y >/dev/null
          npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          sudo apt-get install -y fonts-noto fonts-noto-cjk >/dev/null || true
      - run: node tools/site-audit/shoot.mjs ${{ matrix.shard }} 6
      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.shard }}
          path: out/
          retention-days: 5
